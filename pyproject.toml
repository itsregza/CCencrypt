[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamiteencrypt"
version = "0.1.0"
description = "Adyen and CyberSource card encryption for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "itsregza" }]
dependencies = [
    "cryptography>=42.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/itsregza/dynamiteencrypt"
Repository = "https://github.com/itsregza/dynamiteencrypt"

[tool.setuptools.packages.find]
where = ["."]
include = ["dynamiteencrypt*"]
